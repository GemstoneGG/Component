# This workflow will build a Java project with Maven
# For more information see: https://docs.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven
on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

env:
  DEPLOY_BRANCH: refs/heads/master

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: 'zulu'
          cache: 'maven'
          server-id: velocityctd
          server-username: MAVEN_USERNAME
          server-password: MAVEN_PASSWORD

      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress verify

      - name: Deploy Snapshot to Maven Repository
        if: github.ref == env.DEPLOY_BRANCH
        env:
          MAVEN_USERNAME: ${{ secrets.MAVEN_USERNAME }}
          MAVEN_PASSWORD: ${{ secrets.MAVEN_PASSWORD }}
        run: mvn --batch-mode --no-transfer-progress -DskipTests deploy
